; PHP 配置示例文件
; 复制此文件为 php.ini 并根据实际环境修改配置

; 扩展目录（使用相对路径或绝对路径）
; Windows 示例：
; extension_dir = "C:\PHP\ext"
; extension_dir = "ext"  ; 如果 PHP 安装在默认路径

; Linux 示例：
; extension_dir = "/usr/lib/php/extensions"
; extension_dir = "./ext"  ; 相对路径

; 启用 SQLite3 扩展
extension=php_sqlite3.dll
extension=php_pdo_sqlite.dll

; 其他常用配置
; memory_limit = 256M
; upload_max_filesize = 10M
; post_max_size = 10M
; max_execution_time = 30
